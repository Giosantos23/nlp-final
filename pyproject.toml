[project]
name = "docuerp"
version = "0.1.0"
description = "DocuERP: asistente RAG agéntico para soporte funcional de Odoo con citas verificables, RBAC y HITL."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Giovanni Santos" },
    { name = "Alexis Mesías" },
]
dependencies = [
    # Contratos y configuración
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # CLI y presentación en terminal
    "typer>=0.12",
    "rich>=13.7",
    # Cómputo científico y ML
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "torch>=2.3",
    "sentence-transformers>=3.0",
    "FlagEmbedding>=1.2",
    "transformers>=4.44",
    # Índices de recuperación
    "chromadb>=0.5",
    "rank-bm25>=0.2.2",
    # Ingesta de documentos
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "docutils>=0.21",
    "playwright>=1.45",
    "markdown>=3.6",
    "jinja2>=3.1",
    # Orquestación agéntica y LLM
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "claude-agent-sdk>=0.2.183",
    "anthropic>=0.40",
    # API
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "httpx>=0.27",
    # Datos sintéticos, figuras y utilidades
    "faker>=26.0",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "unidecode>=1.3",
    "regex>=2024.5.15",
    "tqdm>=4.66",
    "orjson>=3.10",
]

[project.scripts]
docuerp = "docuerp.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docuerp"]

[tool.uv]
default-groups = ["dev"]

# ---------------------------------------------------------------------------
# Calidad de código
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["frontend", "video", "data", ".cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PT"]
ignore = [
    "RUF001",  # caracteres ambiguos: el proyecto usa texto en español (á, é, ñ, «»)
    "RUF002",
    "RUF003",
    "B008",    # typer usa llamadas en valores por defecto (typer.Option)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "PT011"]

[tool.ruff.lint.isort]
known-first-party = ["docuerp"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["docuerp"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

# ---------------------------------------------------------------------------
# Pruebas
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --import-mode=importlib -m \"not slow and not llm\""
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: descarga o carga modelos pesados (embeddings, reranker); excluida por defecto",
    "llm: invoca al proveedor LLM real (Agent SDK / API); excluida por defecto",
]
filterwarnings = [
    "ignore::DeprecationWarning:pydantic.*",
]

[tool.coverage.run]
source = ["src/docuerp"]
branch = true
